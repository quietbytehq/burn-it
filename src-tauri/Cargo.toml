[package]
name = "burn-it"
version = "0.1.1"
description = "Burn It! — write Linux and Windows ISOs to USB drives, on Linux and Windows"
authors = ["Quiet Byte"]
license = "Apache-2.0"
repository = "https://github.com/quietbytehq/burn-it"
edition = "2021"

[lib]
name = "burn_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
