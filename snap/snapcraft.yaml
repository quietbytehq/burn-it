name: burn-it
base: core24
adopt-info: burn-it
summary: Make bootable USB drives from Linux and Windows ISO images
description: |
  Burn It! writes Linux and Windows ISO images to USB drives, so you can install
  an operating system from a stick. It runs on Linux and Windows, it is free and
  open source, and it works fully offline with no account.

  It shows only removable USB drives, asks you to confirm the drive you picked, and
  does all disk work through the system's UDisks2 service, which asks for your
  permission with the normal system password prompt. Burn It! never runs as root.

  Burn It! needs the udisks2 interface. If it says it cannot reach the disk service, run:
  sudo snap connect burn-it:udisks2
license: Apache-2.0
icon: snap/gui/burn-it.png
website: https://github.com/quietbytehq/burn-it
source-code: https://github.com/quietbytehq/burn-it
issues: https://github.com/quietbytehq/burn-it/issues
contact: https://github.com/quietbytehq/burn-it/issues

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  burn-it:
    command: usr/bin/burn-it
    common-id: io.github.quietbytehq.burn-it
    desktop: usr/share/applications/io.github.quietbytehq.burn-it.desktop
    extensions: [gnome]
    # udisks2: every disk operation (raw write, partition, FAT32 format, mounting the ISO
    #          and the stick) is a request to the host's UDisks2 service, which shows the
    #          polkit password prompt. The app itself never gets raw device access.
    # home / removable-media: read the ISO the user picked; write files onto the mounted
    #          stick under /media (Windows ISOs).
    # No network access: Burn It! is fully offline.
    plugs:
      - home
      - removable-media
      - udisks2
    environment:
      # WebKitGTK starts its helper programs from a fixed path; point it inside the snap.
      WEBKIT_EXEC_PATH: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
      # WebKit's own sandbox cannot nest inside the snap sandbox, which already confines the app.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

parts:
  burn-it:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - curl
      - file
      - pkg-config
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - librsvg2-dev
      - libayatana-appindicator3-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - shared-mime-info
      # wimlib-imagex splits Windows' install.wim (>4 GB) into FAT32-sized parts
      - wimtools
    override-build: |
      set -eu
      craftctl default
      # Rust (the snap build has network access).
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      . "$HOME/.cargo/env"
      cargo build --release --manifest-path src-tauri/Cargo.toml --bin burn-it --features tauri/custom-protocol
      install -Dm755 src-tauri/target/release/burn-it "$CRAFT_PART_INSTALL/usr/bin/burn-it"

      id=io.github.quietbytehq.burn-it
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      cat > "$CRAFT_PART_INSTALL/usr/share/applications/$id.desktop" <<EOF
      [Desktop Entry]
      Type=Application
      Name=Burn It!
      GenericName=USB image writer
      Comment=Make bootable USB drives from Linux and Windows ISO images
      Exec=burn-it
      Icon=\${SNAP}/meta/gui/burn-it.png
      Categories=System;Utility;
      Keywords=usb;iso;bootable;burn;installer;
      Terminal=false
      EOF

      craftctl set version="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
